<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Currency Exchange</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="app.js" defer></script>
  </head>
  <body>
    <img src="img/logo.jpg" class="logo" alt="money-logo" />
    <h1>Exchange Rates Now</h1>
    <p>Choose your respective money & amount , we offer 166 currencies</p>
    <div class="container">
      <div class="currency">
        <select id="currency-one"></select>
        <input type="number" id="amount-one" placeholder="0" value="1" min="0" />
      </div>

      <!-- swap button -->
      <div class="swap-rate-container">
        <button class="btn" id="swap">Swap</button>
        <div class="rate" id="rate"></div>
      </div>

      <div class="currency">
        <select id="currency-two"></select>
        <input type="number" id="amount-two" placeholder="0" min="0" />
      </div>
    </div>
  </body>
</html>
